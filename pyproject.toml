[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sre-buddy"
version = "0.1.1"
description = "Your debugging buddy for SRE works."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Sourav Paul", email = "souravpaul@protonmail.com"},
]
dependencies = [
    "google-genai>=1.0",
    "pydantic>=2.0",
    "python-dotenv",
    "rich",
    "pytest",
    "pyyaml",
    "kubernetes",
    "numpy",
    "rank-bm25",
    "qdrant-client",
    "sentence-transformers",
    "pypdf",
    "langchain-text-splitters",
]

[project.scripts]
playground = "llm_playground_cli.cli:main"
sre-buddy = "llm_playground_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_playground_cli"]